[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-storage"
version = "1.0.0"
description = "Fault-Tolerant Distributed Object Storage System"
authors = [{ name = "Vault Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "rich>=13.7.0"
]
requires-python = ">=3.10"

[project.scripts]
vault = "vault.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
